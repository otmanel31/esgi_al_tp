# Configuration de l'application monolithique IoT
quarkus.application.name=iot-monolith

# Configuration HTTP
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Logs
quarkus.log.level=INFO
quarkus.log.category."fr.esgi.iot".level=DEBUG

# Banner personnalisé
quarkus.banner.enabled=true

# Dev mode
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Configuration du scheduler (pour MessageBrokerSimulator)
quarkus.scheduler.enabled=true
quarkus.log.category."io.quarkus.scheduler".level=DEBUG
